<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบรายงานสถานการณ์อุทกภัย - โรงพยาบาลไทรโยค</title>
  
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- CSS Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-icon">🌊</div>
        <div class="brand-text">
          <h1>สถานการณ์อุทกภัย โรงพยาบาลไทรโยค</h1>
          <p>ระบบรายงานและสร้างภาพสารสนเทศอัตโนมัติ (Google Sheets + GitHub Pages + GAS)</p>
        </div>
      </div>

      <!-- Controls Toolbar -->
      <div class="toolbar no-print">
        <div class="date-selector-wrapper">
          <label for="dateSelect">📅 เลือกวันที่:</label>
          <select id="dateSelect" class="date-select">
            <option value="">กำลังโหลดข้อมูล...</option>
          </select>
        </div>

        <button id="btnRefresh" class="btn btn-light" title="ดึงข้อมูลล่าสุดจาก Google Sheets">
          🔄 ดึงข้อมูลใหม่
        </button>

        <button id="btnPrint" class="btn btn-primary" title="พิมพ์รายงานหรือบันทึกเป็น PDF">
          🖨️ สั่งพิมพ์รายงาน
        </button>

        <button id="btnDownload" class="btn btn-success" title="ดาวน์โหลดรูปภาพความละเอียดสูง (1024x1536)">
          💾 ดาวน์โหลดรูปภาพ
        </button>

        <a href="admin.html" class="btn btn-warning" title="ปรับตำแหน่งและเพิ่มตัวอักษรลงบนรูปภาพ">
          ⚙️ จัดตำแหน่ง/เพิ่มข้อความ
        </a>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="app-container">
    <!-- Left Column: Infographic Preview -->
    <section class="preview-card">
      <div class="preview-header no-print">
        <div class="preview-title">
          <span>📊 ตัวอย่างภาพรายงาน (Infographic Preview)</span>
        </div>
        <span class="status-pill-badge green">● พร้อมแสดงผล</span>
      </div>

      <div class="canvas-wrapper">
        <canvas id="reportCanvas" width="1024" height="1536"></canvas>
      </div>
    </section>

    <!-- Right Column: Interactive Data Form -->
    <aside class="form-card no-print">
      <div class="form-header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div class="form-title" id="formHeaderTitle">📝 ตรวจสอบและแก้ไขข้อมูล (58 รายการ: A - BF)</div>
          <span id="formColCountBadge" class="status-pill-badge blue" style="font-size: 0.75rem;">58 คอลัมน์</span>
        </div>
        <div style="margin-top: 0.6rem;">
          <input type="text" id="formSearchInput" class="input-control" placeholder="🔍 ค้นหาหัวข้อ / คอลัมน์..." style="padding: 0.4rem 0.65rem; font-size: 0.85rem; width: 100%;">
        </div>
      </div>

      <div class="form-body" id="dynamicFormBody">
        <div style="text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.9rem;">
          ⏳ กำลังโหลดคอลัมน์ข้อมูลจาก Google Sheets...
        </div>
      </div>
    </aside>
  </main>

  <!-- Toast Notification -->
  <div id="toast"></div>

  <!-- Assets & App Scripts -->
  <script src="layout_default.js"></script>
  <script src="assets.js"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
